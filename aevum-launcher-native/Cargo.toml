[package]
name = "aevum-launcher"
version = "2.1.0"
edition = "2021"
description = "Aevum Launcher — a space-themed Minecraft client launcher"
authors = ["Aevum"]
license = "MIT"

[[bin]]
name = "aevum-launcher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
serde_json = "1"
ureq = "2"
sha1 = "0.10"
zip = "2"
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
